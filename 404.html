<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Delegada Raquel Gallinati</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a1f44">
    <link rel="icon" type="image/webp" href="img/favicon-fast.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #06152f 0%, #0a1f44 54%, #031026 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .box { max-width: 520px; }
        .code { font-size: 5rem; font-weight: 800; color: #ffcc00; line-height: 1; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; margin-bottom: 12px; }
        p { font-size: 0.95rem; opacity: 0.8; line-height: 1.6; margin-bottom: 28px; }
        a.btn {
            display: inline-block; background: #ffcc00; color: #0a1f44;
            font-weight: 700; text-decoration: none; padding: 14px 34px;
            border-radius: 50px; transition: transform 0.25s ease;
        }
        a.btn:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>O endereço que você tentou acessar não existe ou foi movido. Volte para a página inicial e acesse a Cartilha de Proteção, os canais de denúncia e a comunidade oficial.</p>
        <a class="btn" href="/">Voltar ao início</a>
    </div>
</body>
</html>
